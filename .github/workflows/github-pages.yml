name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: dotnet publish RacerConfigurator.VisitorPassGenerator/RacerConfigurator.VisitorPassGenerator.csproj -c Release -o publish_output --nologo

      - name: Rewrite base href for GitHub Pages subpath
        run: sed -i 's|<base href="/" />|<base href="/racer-configurator-visitor-pass-generator/" />|' publish_output/wwwroot/index.html

      - name: Add .nojekyll
        run: touch publish_output/wwwroot/.nojekyll

      - name: SPA fallback for deep links
        run: cp publish_output/wwwroot/index.html publish_output/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish_output/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
